name: CI

on:
  workflow_call:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify pinned toolchain
        run: |
          node --version
          test "$(pnpm --version)" = "$(node -p "require('./package.json').engines.pnpm")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint, dead code, types, and production build
        run: pnpm check:com

      - name: Test release rules without publishing
        run: pnpm test:release
